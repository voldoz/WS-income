<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنامج المشاريع</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0c1220;
  color:white;
}
.container{max-width:900px;margin:auto;padding:20px}
.card{
  background:#111a2e;
  padding:20px;
  border-radius:18px;
  margin-bottom:20px;
}
input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid #2a3550;
  background:#0f1a30;
  color:white;
}
button{
  padding:10px 18px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}
.primary{background:#6f8cff;color:black}
.green{background:#2ecc71;color:black}
.red{background:#ff4d4d}
.tab{
  padding:8px 16px;
  border-radius:20px;
  border:1px solid #2a3550;
  cursor:pointer;
}
.activeTab{
  background:#6f8cff;
  color:black;
}
.project{
  background:#0f1a30;
  padding:15px;
  border-radius:15px;
  margin-bottom:15px;
}
.badge{
  padding:4px 10px;
  border-radius:15px;
  font-size:12px;
  font-weight:bold;
}
.unpaid{background:#ff4d4d33;color:#ff4d4d}
.paid{background:#2ecc7133;color:#2ecc71}
.totalBox{
  padding:12px;
  border-radius:15px;
  background:#16223a;
  margin-top:10px;
  font-weight:bold;
}
.hidden{display:none}
</style>
</head>

<body>
<div class="container">

<!-- LOGIN -->
<div id="loginPage" class="card">
<h3>تسجيل</h3>
<input id="name" placeholder="الاسم">
<input id="pin" placeholder="PIN (6 أرقام)" maxlength="6">
<button class="primary" onclick="login()">دخول</button>
</div>

<!-- NEW PROJECT -->
<div id="newPage" class="card hidden">
<h3>مشروع جديد</h3>

<input id="projectName" placeholder="اسم العمل">
<input id="workType" placeholder="نوع العمل">

<div id="services"></div>

<button onclick="calculate()" class="primary">احسب</button>
<button onclick="saveProject()" class="green">حفظ</button>

<div class="totalBox">
الإجمالي: <span id="total">0</span>
</div>
</div>

<!-- PROJECTS -->
<div id="projectsPage" class="card hidden">
<div style="display:flex;gap:10px;margin-bottom:15px">
<div class="tab activeTab" onclick="switchTab('unpaid')" id="tabUnpaid">غير مستلم</div>
<div class="tab" onclick="switchTab('paid')" id="tabPaid">مستلم</div>
</div>

<div id="projectList"></div>

<div class="totalBox">
المجموع: <span id="listTotal">0</span>
</div>
</div>

</div>

<script>
const STORAGE_KEY="projects_v_final";
let currentTab="unpaid";

// ===== SAFE STORAGE =====
function loadProjects(){
  const raw=localStorage.getItem(STORAGE_KEY);
  if(!raw) return [];
  try{
    const data=JSON.parse(raw);
    return Array.isArray(data)?data:[];
  }catch{
    return [];
  }
}
function saveProjects(data){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(Array.isArray(data)?data:[]));
}

// ===== LOGIN =====
function login(){
  const name=document.getElementById("name").value.trim();
  const pin=document.getElementById("pin").value.trim();
  if(!name||!/^[0-9]{6}$/.test(pin)){
    alert("ادخل اسم و PIN صحيح");
    return;
  }
  localStorage.setItem("user",JSON.stringify({name,pin}));
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("newPage").classList.remove("hidden");
  document.getElementById("projectsPage").classList.remove("hidden");
}

// ===== SERVICES 10 ROWS =====
const servicesDiv=document.getElementById("services");
for(let i=1;i<=10;i++){
  servicesDiv.innerHTML+=`
    <input class="serviceName" placeholder="اسم الخدمة ${i}">
    <input class="serviceAmount" placeholder="المبلغ">
  `;
}

// ===== CALCULATE =====
function calculate(){
  let total=0;
  document.querySelectorAll(".serviceAmount").forEach(input=>{
    total+=Number(input.value)||0;
  });
  document.getElementById("total").innerText=total;
  return total;
}

// ===== SAVE PROJECT =====
function saveProject(){
  const name=document.getElementById("projectName").value.trim();
  const type=document.getElementById("workType").value.trim();
  if(!name||!type){
    alert("اكتب اسم العمل ونوع العمل");
    return;
  }

  const services=[];
  const names=document.querySelectorAll(".serviceName");
  const amounts=document.querySelectorAll(".serviceAmount");

  for(let i=0;i<10;i++){
    const sName=names[i].value.trim();
    const sAmount=Number(amounts[i].value)||0;
    if(sName||sAmount){
      services.push({name:sName||"خدمة",amount:sAmount});
    }
  }

  if(services.length===0){
    alert("ادخل خدمة واحدة على الأقل");
    return;
  }

  const projects=loadProjects(); // ← دايم يرجع Array
  const total=calculate();

  projects.unshift({
    id:Date.now(),
    projectName:name,
    workType:type,
    services:services,
    total:total,
    paid:false
  });

  saveProjects(projects);
  renderProjects();
  switchTab("unpaid");
}

// ===== RENDER =====
function renderProjects(){
  const list=document.getElementById("projectList");
  list.innerHTML="";
  const projects=loadProjects();
  let sum=0;

  projects.forEach(p=>{
    if((currentTab==="paid"&&p.paid)||(currentTab==="unpaid"&&!p.paid)){
      sum+=p.total;

      const div=document.createElement("div");
      div.className="project";
      div.innerHTML=`
        <div style="display:flex;justify-content:space-between">
          <div>
            <b>${p.projectName}</b><br>
            <small>${p.workType}</small>
          </div>
          <span class="badge ${p.paid?'paid':'unpaid'}">
            ${p.paid?'مستلم':'غير مستلم'}
          </span>
        </div>
        <hr>
        ${p.services.map(s=>`
          <div style="display:flex;justify-content:space-between">
            <span>${s.name}</span>
            <span>${s.amount}</span>
          </div>
        `).join("")}
        <hr>
        <b>الإجمالي: ${p.total}</b>
        <br><br>
        <button onclick="togglePaid(${p.id})" class="${p.paid?'red':'green'}">
          ${p.paid?'رجعه غير مستلم':'تم الاستلام'}
        </button>
      `;
      list.appendChild(div);
    }
  });

  document.getElementById("listTotal").innerText=sum;
}

// ===== TOGGLE =====
function togglePaid(id){
  const projects=loadProjects();
  const index=projects.findIndex(p=>p.id===id);
  if(index>-1){
    projects[index].paid=!projects[index].paid;
    saveProjects(projects);
    renderProjects();
  }
}

// ===== SWITCH TAB =====
function switchTab(tab){
  currentTab=tab;
  document.getElementById("tabUnpaid").classList.remove("activeTab");
  document.getElementById("tabPaid").classList.remove("activeTab");
  if(tab==="unpaid"){
    document.getElementById("tabUnpaid").classList.add("activeTab");
  }else{
    document.getElementById("tabPaid").classList.add("activeTab");
  }
  renderProjects();
}
</script>
</body>
</html>
