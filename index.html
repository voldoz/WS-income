<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنامج المشاريع</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0f172a;
  color:white;
}
.container{max-width:1100px;margin:auto;padding:20px}
.card{
  background:#1e293b;
  padding:20px;
  border-radius:18px;
  margin-bottom:20px;
}
input,select{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #334155;
  background:#0f172a;
  color:white;
}
button{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
.primary{background:#6366f1}
.green{background:#22c55e}
.red{background:#ef4444}
.badge{
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
}
.unpaid{background:#ef444433;color:#ef4444}
.paid{background:#22c55e33;color:#22c55e}
.statBox{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-bottom:20px;
}
.stat{
  background:#1e293b;
  padding:15px;
  border-radius:15px;
  text-align:center;
}
.hidden{display:none}
.project{
  background:#0f172a;
  padding:15px;
  border-radius:15px;
  margin-bottom:15px;
}
</style>
</head>

<body>
<div class="container">

<!-- STATS -->
<div class="statBox">
<div class="stat">عدد المشاريع<br><b id="sTotal">0</b></div>
<div class="stat">غير مستلم<br><b id="sUnpaid">0</b></div>
<div class="stat">مستلم<br><b id="sPaid">0</b></div>
<div class="stat">إجمالي محقق<br><b id="sRealized">0</b></div>
<div class="stat">صافي الربح<br><b id="sNet">0</b></div>
</div>

<!-- LOGIN -->
<div id="login" class="card">
<h3>تسجيل</h3>
<input id="name" placeholder="الاسم">
<input id="pin" placeholder="PIN 6 أرقام" maxlength="6">
<button class="primary" onclick="login()">دخول</button>
</div>

<!-- NEW PROJECT -->
<div id="newProject" class="card hidden">
<h3>مشروع جديد</h3>
<input id="projectName" placeholder="اسم العمل">
<input id="workType" placeholder="نوع العمل">

<div id="services"></div>

<button onclick="calculate()" class="primary">احسب</button>
<button onclick="saveProject()" class="green">حفظ</button>

<p>إجمالي المشروع: <b id="total">0</b></p>
</div>

<!-- LIST -->
<div id="listSection" class="card hidden">
<h3>المشاريع</h3>

<button onclick="showTab('unpaid')" class="primary">غير مستلم</button>
<button onclick="showTab('paid')" class="green">مستلم</button>
<button onclick="showTab('net')" class="red">صافي الربح</button>

<div id="projectList"></div>
<p>المجموع: <b id="listTotal">0</b></p>
</div>

</div>

<script>

const STORAGE="projects_data_v2";
let currentTab="unpaid";

// ===== SERVICES 10 =====
const sDiv=document.getElementById("services");
for(let i=1;i<=10;i++){
  sDiv.innerHTML+=`
    <select class="owner">
      <option value="">غير ذلك</option>
      <option value="waleed">وليد سلطان</option>
    </select>
    <input class="serviceName" placeholder="اسم الخدمة ${i}">
    <input class="serviceAmount" placeholder="المبلغ">
    <hr>
  `;
}

// ===== LOGIN =====
function login(){
  const name=document.getElementById("name").value.trim();
  const pin=document.getElementById("pin").value.trim();
  if(!name||!/^[0-9]{6}$/.test(pin)){
    alert("ادخل بيانات صحيحة");
    return;
  }
  localStorage.setItem("user",JSON.stringify({name,pin}));
  document.getElementById("login").classList.add("hidden");
  document.getElementById("newProject").classList.remove("hidden");
  document.getElementById("listSection").classList.remove("hidden");
}

// ===== STORAGE SAFE =====
function load(){
  const raw=localStorage.getItem(STORAGE);
  if(!raw) return [];
  try{
    const data=JSON.parse(raw);
    return Array.isArray(data)?data:[];
  }catch{
    return [];
  }
}
function save(data){
  localStorage.setItem(STORAGE,JSON.stringify(data));
}

// ===== CALCULATE =====
function calculate(){
  let total=0;
  document.querySelectorAll(".serviceAmount").forEach(i=>{
    total+=Number(i.value)||0;
  });
  document.getElementById("total").innerText=total;
  return total;
}

// ===== SAVE PROJECT =====
function saveProject(){
  const name=document.getElementById("projectName").value.trim();
  const type=document.getElementById("workType").value.trim();
  if(!name||!type){alert("اكتب اسم ونوع العمل");return;}

  const owners=document.querySelectorAll(".owner");
  const names=document.querySelectorAll(".serviceName");
  const amounts=document.querySelectorAll(".serviceAmount");

  const services=[];
  for(let i=0;i<10;i++){
    const sName=names[i].value.trim();
    const sAmount=Number(amounts[i].value)||0;
    const owner=owners[i].value;
    if(sName||sAmount){
      services.push({name:sName||"خدمة",amount:sAmount,owner});
    }
  }
  if(services.length===0){alert("ادخل خدمة");return;}

  const projects=load();
  projects.unshift({
    id:Date.now(),
    projectName:name,
    workType:type,
    services:services,
    total:calculate(),
    paid:false
  });

  save(projects);
  render();
}

// ===== RENDER =====
function render(){
  const projects=load();
  const list=document.getElementById("projectList");
  list.innerHTML="";
  let sum=0;
  let realized=0;
  let net=0;

  projects.forEach(p=>{
    if(currentTab==="unpaid"&&!p.paid||
       currentTab==="paid"&&p.paid){

      sum+=p.total;
      const div=document.createElement("div");
      div.className="project";
      div.innerHTML=`
        <b>${p.projectName}</b> - ${p.workType}
        <span class="badge ${p.paid?'paid':'unpaid'}">
        ${p.paid?'مستلم':'غير مستلم'}
        </span><br><br>
        ${p.services.map(s=>`
          ${s.name} - ${s.amount} ${s.owner==="waleed"?"(وليد)":""}<br>
        `).join("")}
        <br><b>الإجمالي: ${p.total}</b><br>
        <button onclick="toggle(${p.id})" class="${p.paid?'red':'green'}">
        ${p.paid?'رجعه غير مستلم':'تم الاستلام'}
        </button>
      `;
      list.appendChild(div);
    }

    // حساب إجمالي محقق
    if(p.paid) realized+=p.total;

    // حساب صافي الربح
    p.services.forEach(s=>{
      if(s.owner==="waleed") net+=s.amount;
    });
  });

  // تبويب صافي الربح
  if(currentTab==="net"){
    list.innerHTML="";
    sum=net;
    projects.forEach(p=>{
      p.services.forEach(s=>{
        if(s.owner==="waleed"){
          list.innerHTML+=`
          <div class="project">
          ${p.projectName} - ${s.name} - ${s.amount}
          </div>`;
        }
      });
    });
  }

  document.getElementById("listTotal").innerText=sum;
  document.getElementById("sTotal").innerText=projects.length;
  document.getElementById("sUnpaid").innerText=projects.filter(p=>!p.paid).length;
  document.getElementById("sPaid").innerText=projects.filter(p=>p.paid).length;
  document.getElementById("sRealized").innerText=realized;
  document.getElementById("sNet").innerText=net;
}

// ===== TOGGLE =====
function toggle(id){
  const projects=load();
  const index=projects.findIndex(p=>p.id===id);
  if(index>-1){
    projects[index].paid=!projects[index].paid;
    save(projects);
    render();
  }
}

// ===== TAB =====
function showTab(tab){
  currentTab=tab;
  render();
}

render();
</script>
</body>
</html>
